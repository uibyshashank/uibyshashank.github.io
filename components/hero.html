  Source partial for the hero section.

  This file is the SOURCE OF TRUTH for the hero. index.html is the

  To edit the hero: update this file, then paste the result into
  index.html in place of the existing <section class="hero" id="home">…</section>.

  Name lockup:
  · .hero-name-first  → Inter Display (extra-bold) via the variable Inter
                        opsz axis (font-optical-sizing) — renders "SHASHANK"

  Hero previews use downscaled thumbnails from assets/images/cards/ (~85%
  smaller than the full-size screenshots used in the modals). Cards are
  exported at 2x (960px wide) so they stay crisp on Retina displays.
  ====================================================================== -->
